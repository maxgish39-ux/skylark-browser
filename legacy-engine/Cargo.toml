[package]
name = "independent-browser"
version = "0.3.0"
edition = "2021"
build = "build.rs"
description = "Skylark: a from-scratch browser engine in Rust and C++ with a native Android UI"
license = "MIT"

[lib]
name = "independent_browser"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
font8x8 = "0.3"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = { version = "2.12", default-features = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
minifb = "0.27"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
